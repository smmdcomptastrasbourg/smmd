<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMMD - Connexion</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMMD">
    <meta name="theme-color" content="#1e40af">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

    <div id="login-card" class="bg-white p-8 rounded-[40px] shadow-xl w-full max-w-sm border border-gray-100 transition-all">
        <h1 class="text-4xl font-black italic mb-2 text-center text-blue-900 tracking-tighter">SMMD.</h1>
        <p class="text-center text-[10px] font-black uppercase tracking-widest text-gray-300 mb-8">Comptabilité des Maisons</p>

        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-black uppercase ml-2 mb-1 block text-gray-400 tracking-widest">Identifiant</label>
                <input type="text" id="login-user" placeholder="ex: guillaume.legall"
                    class="w-full p-4 bg-gray-100 rounded-2xl border-none font-bold focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase ml-2 mb-1 block text-gray-400 tracking-widest">Mot de passe</label>
                <input type="password" id="login-pass" placeholder="••••••••"
                    class="w-full p-4 bg-gray-100 rounded-2xl border-none font-bold focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
            <button onclick="handleLogin()" id="btn-login"
                class="w-full bg-blue-900 text-white font-black py-5 rounded-2xl uppercase tracking-widest shadow-lg active:scale-95 transition-all mt-4">
                Se connecter
            </button>
        </div>
        <p id="error-msg" class="text-red-500 text-[10px] font-black uppercase text-center mt-6 hidden"></p>
    </div>

    <div id="loading-screen" class="hidden text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-900 mx-auto mb-4"></div>
        <p class="font-black italic text-blue-900 uppercase tracking-widest text-[10px]">Connexion en cours...</p>
    </div>

    <script>
        const sb = supabase.createClient(SMMD_CONFIG.url, SMMD_CONFIG.key);

        async function checkSession() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                await redirectUser(user.id);
            }
        }

        async function handleLogin() {
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('error-msg');
            const card = document.getElementById('login-card');
            const load = document.getElementById('loading-screen');

            let identifier = document.getElementById('login-user').value.trim().toLowerCase();
            const password = document.getElementById('login-pass').value;

            if (!identifier || !password) {
                err.innerText = "Champs requis";
                err.classList.remove('hidden');
                return;
            }

            if (!identifier.includes('@')) identifier += "@smmd.fr";

            btn.disabled = true;
            btn.innerText = "PATIENTEZ...";
            err.classList.add('hidden');

            const { data, error: authError } = await sb.auth.signInWithPassword({ email: identifier, password });

            if (authError) {
                err.innerText = "Identifiant ou mot de passe incorrect";
                err.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Se connecter";
                return;
            }

            card.classList.add('hidden');
            load.classList.remove('hidden');
            await redirectUser(data.user.id);
        }

        async function redirectUser(userId) {
            const { data: profile, error } = await sb
                .from('profiles')
                .select('role')
                .eq('id', userId)
                .maybeSingle();

            if (error || !profile) {
                document.getElementById('error-msg').innerText = "Profil introuvable. Contactez l'administrateur.";
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('login-card').classList.remove('hidden');
                await sb.auth.signOut();
                return;
            }

            if (profile.role === 'chef') window.location.href = "chef.html";
            else if (profile.role === 'admin') window.location.href = "admin.html";
            else window.location.href = "user.html";
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('SW enregistré'))
                    .catch(e => console.warn('Erreur SW', e));
            });
        }

        checkSession();
    </script>
</body>
</html>
