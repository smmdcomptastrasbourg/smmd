<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SMMD — Connexion</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
<meta name="apple-mobile-web-app-title" content="SMMD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#8B1E2D">
<link rel="preconnect" href="https://xccnnckuphxloxfrqtkf.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="v2/style.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261126c"></script>
<style>
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  .login { width: 100%; max-width: 400px; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px; text-align: center; }
  .logo img { width: 72px; height: 72px; border-radius: 18px; }
  .logo h1 { font-size: 30px; font-weight: 800; color: var(--primary); }
  .pass-wrap { position: relative; }
  .pass-wrap .iconbtn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
  .pass-wrap .input { padding-right: 52px; }
</style>
</head>
<body>
<main class="login">
  <div class="logo">
    <img src="./icon-192.png" alt="">
    <h1>SMMD</h1>
    <p class="muted" style="margin:0">Comptabilité des maisons</p>
  </div>

  <div id="login-card" class="card stack" style="padding:24px">
    <h2>Connexion</h2>
    <label class="field"><span>Identifiant</span>
      <input type="text" id="login-user" class="input" placeholder="prenom.nom" autocomplete="username" autocapitalize="none" spellcheck="false"
        onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()"></label>
    <label class="field"><span>Mot de passe</span>
      <span class="pass-wrap"><input type="password" id="login-pass" class="input" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleLogin()">
        <button type="button" class="iconbtn" onclick="togglePass()" aria-label="Afficher ou masquer le mot de passe" id="toggle-pass-btn">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button></span></label>
    <div id="error-msg" class="banner warn hidden" role="alert"><p style="margin:0"></p></div>
    <button id="btn-login" class="btn block" style="min-height:54px" onclick="handleLogin()">Se connecter</button>
    <p class="small muted" style="margin:0;text-align:center">Mot de passe oublié ? Demandez à l'administrateur de vous en définir un nouveau.</p>
  </div>

  <div id="loading-screen" class="hidden" style="text-align:center;padding:40px 0" role="status">
    <div class="spin" style="margin:0 auto 14px;width:40px;height:40px;border-width:4px"></div>
    <p class="muted bold">Connexion en cours…</p>
  </div>

  <div id="install-banner" class="hidden" style="margin-top:16px">
    <button id="install-btn" class="btn ghost block" onclick="installApp()">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
      Installer l'application</button>
  </div>
  <p class="xs muted" style="text-align:center;margin-top:20px">© SMMD Strasbourg</p>
</main>

<div id="offline-banner" class="hidden banner warn" role="status" style="position:fixed;top:12px;left:12px;right:12px;justify-content:center">Pas de connexion réseau</div>

<script>
  const sb = supabase.createClient(SMMD_CONFIG.url, SMMD_CONFIG.key);
  // Destination selon le rôle (nouvelle interface)
  const DEST = { chef: 'v2/chef.html', admin: 'v2/admin.html', user: 'v2/membre.html' };

  window.addEventListener('offline', () => document.getElementById('offline-banner').classList.remove('hidden'));
  window.addEventListener('online', () => document.getElementById('offline-banner').classList.add('hidden'));
  if (!navigator.onLine) document.getElementById('offline-banner').classList.remove('hidden');

  function togglePass() { const i = document.getElementById('login-pass'); i.type = i.type === 'password' ? 'text' : 'password'; }
  function showError(msg) { const el = document.getElementById('error-msg'); el.querySelector('p').textContent = msg; el.classList.remove('hidden'); }
  function hideError() { document.getElementById('error-msg').classList.add('hidden'); }
  function showLoading(on) {
    document.getElementById('login-card').classList.toggle('hidden', on);
    document.getElementById('loading-screen').classList.toggle('hidden', !on);
  }

  async function checkSession() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) { showLoading(true); await redirectUser(user.id); }
  }

  async function handleLogin() {
    if (!navigator.onLine) return showError("Pas de connexion réseau");
    const btn = document.getElementById('btn-login');
    let id = document.getElementById('login-user').value.trim().toLowerCase();
    const pw = document.getElementById('login-pass').value;
    if (!id || !pw) return showError("Saisissez votre identifiant et votre mot de passe");
    if (!id.includes('@')) id += '@smmd.fr';
    hideError();
    btn.disabled = true; btn.textContent = 'Connexion…';
    const { data, error } = await sb.auth.signInWithPassword({ email: id, password: pw });
    btn.disabled = false; btn.textContent = 'Se connecter';
    if (error) return showError("Identifiant ou mot de passe incorrect");
    showLoading(true);
    await redirectUser(data.user.id);
  }

  async function redirectUser(uid) {
    const { data: profile, error } = await sb.from('profiles').select('role,actif').eq('id', uid).maybeSingle();
    if (!error && profile && profile.actif === false) {
      showLoading(false); showError("Compte désactivé — contactez l'administrateur");
      await sb.auth.signOut(); return;
    }
    if (error || !profile) {
      showLoading(false); showError("Profil introuvable — contactez l'administrateur");
      await sb.auth.signOut(); return;
    }
    location.href = DEST[profile.role] || DEST.user;
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

  let _deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _deferredPrompt = e; document.getElementById('install-banner').classList.remove('hidden'); });
  window.addEventListener('appinstalled', () => { document.getElementById('install-banner').classList.add('hidden'); _deferredPrompt = null; });
  async function installApp() {
    if (!_deferredPrompt) {
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      showError(ios ? 'Sur iPhone : touchez le bouton Partager, puis « Sur l\'écran d\'accueil ».' : 'Ouvrez le menu du navigateur (⋮) puis « Ajouter à l\'écran d\'accueil ».');
      return;
    }
    _deferredPrompt.prompt(); await _deferredPrompt.userChoice; _deferredPrompt = null;
    document.getElementById('install-banner').classList.add('hidden');
  }

  if (new URLSearchParams(location.search).get('desactive')) showError("Compte désactivé — contactez l'administrateur");
  checkSession();
</script>
</body>
</html>
