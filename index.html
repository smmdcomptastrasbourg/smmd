<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMMD — Connexion</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
    <meta name="apple-mobile-web-app-title" content="SMMD">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7f1d1d">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #1a0505 0%, #7f1d1d 60%, #991b1b 100%);
            min-height: 100vh; min-height: 100dvh;
        }

        @keyframes slideUp  { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fadeIn   { from{opacity:0} to{opacity:1} }
        @keyframes logoPulse {
            0%   { transform: scale(0.8); opacity:0; }
            60%  { transform: scale(1.08); opacity:1; }
            100% { transform: scale(1); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .anim-up   { animation: slideUp .5s cubic-bezier(.4,0,.2,1) both; }
        .anim-fade { animation: fadeIn .4s ease both; }
        .anim-logo { animation: logoPulse .7s cubic-bezier(.4,0,.2,1) both; }

        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px #f8fafc inset; }

        #btn-login {
            background: linear-gradient(135deg, #991b1b, #7f1d1d);
            box-shadow: 0 8px 24px rgba(153,27,27,.4);
        }
        #btn-login:active { transform: scale(.97); }

        .input-field {
            transition: all .2s;
            border: 2px solid transparent;
        }
        .input-field:focus {
            background: white;
            border-color: #fca5a5;
            box-shadow: 0 0 0 4px rgba(239,68,68,.08);
        }

        /* Loading spinner */
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        /* Card glassmorphism */
        #login-card {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-6 min-h-screen">

    <!-- Logo + titre -->
    <div class="text-center mb-8" style="animation: slideUp .6s .05s cubic-bezier(.4,0,.2,1) both">
        <div class="anim-logo flex justify-center mb-5">
            <img src="./icon-512.png" style="width:90px;height:90px;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 4px 16px rgba(255,255,255,.2))">
        </div>
        <h1 class="text-5xl font-black italic text-white tracking-tighter leading-none">SMMD.</h1>
        <p class="text-[10px] font-black uppercase tracking-[.4em] text-white/40 mt-2">Comptabilité des Maisons</p>
    </div>

    <!-- Card connexion -->
    <div id="login-card" class="bg-white/95 rounded-[40px] w-full max-w-sm shadow-2xl p-8 anim-up" style="animation-delay:.15s">

        <!-- Bande couleur top -->
        <div class="h-1 rounded-full bg-gradient-to-r from-red-700 to-red-900 -mt-8 mx-4 mb-7 rounded-t-none" style="margin-top:-32px;margin-left:-32px;margin-right:-32px;border-radius:32px 32px 0 0"></div>

        <div class="space-y-5">
            <div class="anim-up" style="animation-delay:.2s">
                <label class="text-[9px] font-black uppercase text-slate-400 ml-1 mb-1.5 block tracking-widest">Identifiant</label>
                <input type="text" id="login-user" placeholder="prenom.nom"
                    autocomplete="username" autocapitalize="none" spellcheck="false"
                    class="input-field w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none"
                    onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
            </div>
            <div class="anim-up" style="animation-delay:.25s">
                <label class="text-[9px] font-black uppercase text-slate-400 ml-1 mb-1.5 block tracking-widest">Mot de passe</label>
                <div class="relative">
                    <input type="password" id="login-pass" placeholder="••••••••"
                        autocomplete="current-password"
                        class="input-field w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none pr-12"
                        onkeydown="if(event.key==='Enter')handleLogin()">
                    <button onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors" id="toggle-pass-btn">
                        <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>

            <div id="error-msg" class="hidden bg-red-50 border border-red-100 rounded-2xl px-4 py-3 anim-up">
                <p class="text-[11px] font-bold text-red-600 text-center"></p>
            </div>

            <button id="btn-login" onclick="handleLogin()"
                class="anim-up w-full text-white font-black py-5 rounded-[22px] uppercase tracking-[.2em] text-[12px] active:scale-[.97] transition-all"
                style="animation-delay:.3s">
                Se connecter
            </button>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading-screen" class="hidden text-center anim-fade">
        <div class="spinner mx-auto mb-5"></div>
        <p class="text-white/60 font-black uppercase tracking-[.3em] text-[10px]">Connexion en cours...</p>
    </div>

    <!-- Offline banner -->
    <div id="offline-banner" class="hidden fixed top-4 left-4 right-4 bg-amber-500 text-white rounded-2xl px-4 py-3 text-[11px] font-bold text-center shadow-lg z-50">
        ⚠️ Pas de connexion réseau
    </div>

    <p class="text-white/20 text-[9px] font-bold uppercase tracking-widest mt-8 anim-up" style="animation-delay:.4s">
        © SMMD Strasbourg
    </p>

    <script>
        const sb = supabase.createClient(SMMD_CONFIG.url, SMMD_CONFIG.key);

        window.addEventListener('offline', () => document.getElementById('offline-banner').classList.remove('hidden'));
        window.addEventListener('online',  () => document.getElementById('offline-banner').classList.add('hidden'));
        if (!navigator.onLine) document.getElementById('offline-banner').classList.remove('hidden');

        function togglePass() {
            const input = document.getElementById('login-pass');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.querySelector('p').textContent = msg;
            el.classList.remove('hidden');
        }
        function hideError() { document.getElementById('error-msg').classList.add('hidden'); }

        async function checkSession() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                await redirectUser(user.id);
            }
        }

        async function handleLogin() {
            if (!navigator.onLine) return showError("Pas de connexion réseau");
            const btn = document.getElementById('btn-login');
            let id = document.getElementById('login-user').value.trim().toLowerCase();
            const pw = document.getElementById('login-pass').value;
            if (!id || !pw) return showError("Champs requis");
            if (!id.includes('@')) id += '@smmd.fr';
            hideError();
            btn.innerHTML = '<span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px"></span>Connexion...';
            btn.disabled = true;
            const { data, error } = await sb.auth.signInWithPassword({ email: id, password: pw });
            if (error) {
                showError("Identifiant ou mot de passe incorrect");
                btn.textContent = 'Se connecter'; btn.disabled = false;
                return;
            }
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');
            await redirectUser(data.user.id);
        }

        async function redirectUser(uid) {
            const { data: profile, error } = await sb.from('profiles').select('role').eq('id', uid).maybeSingle();
            if (error || !profile) {
                showError("Profil introuvable — contactez l'administrateur");
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('login-card').classList.remove('hidden');
                await sb.auth.signOut();
                return;
            }
            if (profile.role === 'chef')       window.location.href = 'chef.html';
            else if (profile.role === 'admin') window.location.href = 'admin.html';
            else                               window.location.href = 'user.html';
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
        }
        checkSession();
    </script>
</body>
</html>
